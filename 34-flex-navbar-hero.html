<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive navbar and hero using Flexbox." />
  <title>Navbar + Hero (Flexbox)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      color: #1b263b;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      color: #0077b6;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      align-items: center;
    }

    .links a {
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }

    .links .cta {
      background: #0077b6;
      color: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
    }

    #toggle,
    .burger {
      display: none;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 4rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero__text {
      flex: 1;
    }

    .hero__text h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .hero__text p {
      color: #4a5568;
      margin-bottom: 1.5rem;
      max-width: 45ch;
    }

    .hero__btns {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .btn--primary {
      background: #0077b6;
      color: #fff;
    }

    .btn--ghost {
      border: 2px solid #0077b6;
      color: #0077b6;
    }

    .hero__img {
      flex: 1;
    }

    .hero__img img {
      width: 100%;
      border-radius: 16px;
      display: block;
    }

    @media (max-width: 768px) {
      .burger {
        display: block;
        font-size: 1.8rem;
        cursor: pointer;
      }

      .links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        background: #fff;
        padding: 1rem;
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.08);
      }

      #toggle:checked~.links {
        display: flex;
      }

      .hero {
        flex-direction: column-reverse;
        text-align: center;
        padding: 2rem 1rem;
      }

      .hero__btns {
        justify-content: center;
      }

      .hero__text p {
        margin-inline: auto;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <span class="logo">CloudNine</span>
    <input type="checkbox" id="toggle" />
    <label for="toggle" class="burger" aria-label="Toggle menu">☰</label>
    <ul class="links">
      <li><a href="#">Features</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">About</a></li>
      <li><a class="cta" href="#">Get started</a></li>
    </ul>
  </nav>
  <header class="hero">
    <div class="hero__text">
      <h1>Build faster with the cloud you can trust.</h1>
      <p>
        Deploy, scale and monitor your apps in minutes — no servers to manage.
      </p>
      <div class="hero__btns">
        <a class="btn btn--primary" href="#">Start free</a><a class="btn btn--ghost" href="#">Watch demo</a>
      </div>
    </div>
    <div class="hero__img">
      <img src="https://picsum.photos/id/180/700/500" alt="Laptop showing a dashboard on a desk" />
    </div>
  </header>
</body>

</html>
