<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Job application form using every HTML input type">
  <title>Job Application</title>
</head>

<body>
  <h1>Job Application – Front-End Developer</h1>
  <form action="#" method="post" enctype="multipart/form-data">

    <fieldset>
      <legend>Personal details</legend>
      <p><label for="fn">Full name <input type="text" id="fn" name="fullname" required></label></p>
      <p><label for="em">Email <input type="email" id="em" name="email" required></label></p>
      <p><label for="ph">Phone <input type="tel" id="ph" name="phone"></label></p>
      <p><label for="dob">Date of birth <input type="date" id="dob" name="dob"></label></p>
      <p><label for="web">Portfolio URL <input type="url" id="web" name="website" placeholder="https://"></label></p>
      <p><label for="pw">Create password <input type="password" id="pw" name="password" minlength="8"></label></p>
    </fieldset>

    <fieldset>
      <legend>Job details</legend>
      <p><label for="pos">Position
          <select id="pos" name="position">
            <option>Front-End Developer</option>
            <option>UI Designer</option>
            <option>QA Tester</option>
          </select></label></p>
      <p><label for="join">Earliest joining date <input type="date" id="join" name="join"></label></p>
      <p><label for="slot">Interview slot <input type="datetime-local" id="slot" name="slot"></label></p>
      <p><label for="mo">Preferred start month <input type="month" id="mo" name="month"></label></p>
      <p><label for="wk">Preferred week <input type="week" id="wk" name="week"></label></p>
      <p><label for="tm">Best call time <input type="time" id="tm" name="time"></label></p>
      <p><label for="exp">Years of experience <input type="number" id="exp" name="exp" min="0" max="40"
            value="0"></label></p>
      <p><label for="sal">Expected salary (₹ LPA) <input type="range" id="sal" name="salary" min="2" max="30" value="6"
            oninput="out.value=this.value"> <output id="out">6</output></label></p>
      <p><label for="col">Favourite colour <input type="color" id="col" name="colour" value="#3366ff"></label></p>
      <p><label for="sk">Skills (type or pick)
          <input list="skills" id="sk" name="skill">
          <datalist id="skills">
            <option value="HTML"></option>
            <option value="CSS"></option>
            <option value="JavaScript"></option>
            <option value="Git"></option>
          </datalist></label></p>
      <p><label for="s">Search company policy <input type="search" id="s" name="q"></label></p>
    </fieldset>

    <fieldset>
      <legend>Work mode</legend>
      <label><input type="radio" name="mode" value="onsite" checked> On-site</label>
      <label><input type="radio" name="mode" value="remote"> Remote</label>
      <label><input type="radio" name="mode" value="hybrid"> Hybrid</label>
    </fieldset>

    <fieldset>
      <legend>Technologies known</legend>
      <label><input type="checkbox" name="tech" value="html"> HTML</label>
      <label><input type="checkbox" name="tech" value="css"> CSS</label>
      <label><input type="checkbox" name="tech" value="js"> JavaScript</label>
    </fieldset>

    <p><label for="cv">Upload résumé (PDF) <input type="file" id="cv" name="resume" accept=".pdf"></label></p>
    <p><label for="cover">Cover letter<br>
        <textarea id="cover" name="cover" rows="5" cols="50" maxlength="500"></textarea></label></p>

    <input type="hidden" name="source" value="careers-page">
    <p><label><input type="checkbox" name="agree" required> I confirm that the information is correct</label></p>

    <input type="submit" value="Apply now">
    <input type="reset" value="Reset">
    <input type="button" value="Print" onclick="window.print()">
  </form>
</body>

</html>
