<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Three card variants using border-radius and backgrounds.">
  <title>Three Card Variants</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #eceff4;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .card {
      width: 260px;
      padding: 1.5rem;
      margin: 0;
    }

    .card h2 {
      margin-top: 0;
    }

    .card a {
      display: inline-block;
      margin-top: .5rem;
      padding: .4rem 1rem;
      text-decoration: none;
      font-weight: 600;
    }

    /* Variant 1 – soft rounded, solid colour */
    .card--soft {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
    }

    .card--soft a {
      background: #4361ee;
      color: #fff;
      border-radius: 999px;
    }

    /* Variant 2 – gradient background, big asymmetric radius */
    .card--gradient {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      border-radius: 0 40px 0 40px;
      color: #4a1c24;
    }

    .card--gradient a {
      background: #4a1c24;
      color: #fff;
      border-radius: 8px;
    }

    /* Variant 3 – outlined, dark, square-ish */
    .card--outline {
      background: #1b1b2f;
      color: #e9e9f5;
      border: 2px solid #00e5ff;
      border-radius: 6px;
    }

    .card--outline a {
      border: 2px solid #00e5ff;
      color: #00e5ff;
      border-radius: 4px;
    }

    .card--outline a:hover {
      background: #00e5ff;
      color: #1b1b2f;
    }
  </style>
</head>

<body>
  <h1>Card Variants</h1>
  <div class="cards">
    <article class="card card--soft">
      <h2>Soft</h2>
      <p>White background, 20px radius and a gentle shadow.</p><a href="#">Read more</a>
    </article>
    <article class="card card--gradient">
      <h2>Gradient</h2>
      <p>Gradient background with two rounded corners and two sharp ones.</p><a href="#">Read more</a>
    </article>
    <article class="card card--outline">
      <h2>Outline</h2>
      <p>Dark background, neon border and a small 6px radius.</p><a href="#">Read more</a>
    </article>
  </div>
</body>

</html>
