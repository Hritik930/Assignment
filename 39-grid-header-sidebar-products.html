<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive product grid with header and sidebar using CSS Grid.">
  <title>Store – Header, Sidebar &amp; Product Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f6f7fb;
    }

    .page {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-areas: "header header" "sidebar main" "footer footer";
      min-height: 100vh;
    }

    header {
      grid-area: header;
      background: #14213d;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header input {
      padding: .5rem .8rem;
      border-radius: 6px;
      border: 0;
      width: min(260px, 40vw);
    }

    aside {
      grid-area: sidebar;
      background: #fff;
      padding: 1.5rem;
      border-right: 1px solid #ddd;
    }

    aside h2 {
      font-size: 1rem;
      margin-bottom: .5rem;
    }

    aside ul {
      list-style: none;
      padding: 0;
      margin-bottom: 1.5rem;
    }

    aside li {
      padding: .3rem 0;
    }

    main {
      grid-area: main;
      padding: 1.5rem;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }

    .product {
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .07);
    }

    .product img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      font-size: 1rem;
      margin: .6rem 0 .2rem;
    }

    .product p {
      color: #0a8754;
      font-weight: 700;
    }

    footer {
      grid-area: footer;
      background: #14213d;
      color: #ccc;
      text-align: center;
      padding: 1rem;
    }

    @media (max-width: 720px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-areas: "header" "sidebar" "main" "footer";
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header><strong>ShopGrid</strong><input type="search" placeholder="Search products" aria-label="Search products">
    </header>
    <aside>
      <h2>Categories</h2>
      <ul>
        <li>Electronics</li>
        <li>Clothing</li>
        <li>Home</li>
        <li>Sports</li>
      </ul>
      <h2>Price</h2>
      <ul>
        <li>Under ₹500</li>
        <li>₹500 – ₹2000</li>
        <li>Above ₹2000</li>
      </ul>
    </aside>
    <main>
      <h1 style="margin-bottom:1rem">All Products</h1>
      <div class="products">
        <article class="product"><img src="https://picsum.photos/id/103/300/300" alt="Pair of sneakers">
          <h3>Sneakers</h3>
          <p>₹2,499</p>
        </article>
        <article class="product"><img src="https://picsum.photos/id/1070/300/300" alt="Folded denim jeans">
          <h3>Denim Jeans</h3>
          <p>₹1,299</p>
        </article>
        <article class="product"><img src="https://picsum.photos/id/119/300/300" alt="Backpack on a bench">
          <h3>Backpack</h3>
          <p>₹899</p>
        </article>
        <article class="product"><img src="https://picsum.photos/id/160/300/300" alt="Digital camera">
          <h3>Camera</h3>
          <p>₹18,999</p>
        </article>
        <article class="product"><img src="https://picsum.photos/id/180/300/300" alt="Laptop on a table">
          <h3>Laptop</h3>
          <p>₹54,999</p>
        </article>
        <article class="product"><img src="https://picsum.photos/id/225/300/300" alt="Wooden desk lamp">
          <h3>Desk Lamp</h3>
          <p>₹749</p>
        </article>
      </div>
    </main>
    <footer>&copy; 2026 ShopGrid</footer>
  </div>
</body>

</html>
