<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Landing-page hero section built with position and z-index.">
  <title>Hero Section – position &amp; z-index</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      color: #fff;
    }

    /* layer 0 – background image */
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* layer 1 – dark overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, .65), rgba(0, 0, 0, .25));
      z-index: 1;
    }

    /* layer 3 – sticky nav stays above everything */
    .nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1.5rem;
    }

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
    }

    /* layer 2 – centred text */
    .hero__content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: min(90%, 700px);
    }

    .hero__content h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 1rem;
    }

    .hero__content p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      background: #ff6b35;
      color: #fff;
      padding: .85rem 2rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    /* layer 3 – floating badge pinned bottom-right */
    .badge {
      position: absolute;
      right: 2rem;
      bottom: 2rem;
      z-index: 3;
      background: #fff;
      color: #222;
      padding: .75rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
    }

    .badge strong {
      display: block;
      font-size: 1.6rem;
    }

    /* fixed "back to top" shows position: fixed */
    .fab {
      position: fixed;
      right: 1rem;
      top: 50%;
      z-index: 10;
      background: #fff;
      color: #222;
      padding: .4rem .7rem;
      border-radius: 50%;
      text-decoration: none;
    }

    section.next {
      padding: 4rem 2rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="hero">
    <img class="hero__bg" src="https://picsum.photos/id/1036/1600/900" alt="Snowy mountain range under a pale sky">
    <nav class="nav">
      <span class="logo">TravelNest</span>
      <div><a href="#">Destinations</a><a href="#">Deals</a><a href="#">Contact</a></div>
    </nav>
    <div class="hero__content">
      <h1>Find Your Next Adventure</h1>
      <p>Handpicked trips to the world's most beautiful places.</p>
      <a class="btn" href="#next">Start exploring</a>
    </div>
    <div class="badge"><strong>4.9★</strong>12,000+ happy travellers</div>
  </header>
  <a class="fab" href="#" aria-label="Back to top">↑</a>
  <section class="next" id="next">
    <h2>Popular Destinations</h2>
    <p>Scroll content goes here – the round button on the right stays fixed.</p>
  </section>
</body>

</html>
